<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Saga do Caju e do Código</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="background">
        <main>
            <img class="main-title" src="./assets/images/title.png" alt="A Saga do Caju e do Código">
            <div style="display: none;" class="container fases">
                <button class="fase-button fase1" >FASE 1 - 1º e 2º ANO</button>
                <button class="fase-button fase2" >FASE 2 - 3º E 4º ANO</button>
                <button class="fase-button fase3" >FASE 3 - 4º E 5º ANO</button>
            </div>
            <div class="castanha-wrapper">
                <img class="castanha-btn" src="./assets/images/castanha.png" alt="Castanha"></img>
            </div>
            <img class="placa" src="./assets/images/ufrn.png" alt="Placa">
            <div class="personagens">
                <img class="personagem orientador-eco" src="./assets/images/eco.png" alt="Orientador Eco">
                <img class="personagem professora-luna" src="./assets/images/luna.png" alt="Professora Luna">
                <img class="personagem professora-laura" src="./assets/images/laura.png" alt="Professora Laura">
                <img class="personagem programador-byte" src="./assets/images/byte.png" alt="Programador Byte">
            </div>
        </main>
    </div>
</body>

<script src="https://code.jquery.com/jquery-4.0.0.js"></script>
<script src="index.js"></script>

</html>
